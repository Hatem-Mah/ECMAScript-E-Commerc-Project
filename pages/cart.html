<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ES6 Shop</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1> ES6 Shop</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html" class="nav-link">Home</a></li>
                <li><a href="products.html" class="nav-link">Products</a></li>
                <li><a href="cart.html" class="nav-link active">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-count" id="cartCount">0</span>
                </a></li>
                <li id="authLink"><a href="login.html" class="nav-link">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="cart-page">
        
        <h1>Shopping Cart</h1>
        <div class="cart-container">
            <div class="cart-content" id="cartContent">
                <div class="empty-cart">
                    <p>🛒 Your cart is empty</p>
                    <a href="products.html" class="btn btn-primary">Continue Shopping</a>
                </div>
            </div>

            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div class="summary-card">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (10%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping:</span>
                        <span id="shipping">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    <button id="buyNowBtn" class="btn btn-primary btn-block">Buy Now</button>
                    <a href="products.html" class="btn btn-secondary btn-block">Continue Shopping</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 ES6 Shop. All rights reserved. | Built with Vanilla JavaScript & ES6</p>
    </footer>

    <script type="module" src="../js/cart.js"></script>
    <script type="module" src="../js/navbar.js"></script>
</body>
</html>
